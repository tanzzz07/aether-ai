[project]
name = "aether-ui-backend"
version = "0.1.0"
description = "FastAPI and LangGraph backend for Aether UI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.2",
  "python-jose[cryptography]>=3.3.0",
  "supabase>=2.7.4",
  "redis>=5.0.8",
  "langgraph>=0.2.22"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.4",
  "pytest>=8.3.2"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["apps*", "supabase*", "node_modules*", "docs*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]